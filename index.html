<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>🜃 zalgo-cipher portals ⏾𓃠⟡</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" />
    <style>
      :root {
        --bg: #0b0f1a;
        --muted: #9cb3c9;
        --accent: #f5d97d;
        --text: #e8effa;
        --border: rgba(255, 255, 255, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Space Grotesk", system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 20% 20%, rgba(194, 233, 255, 0.15), transparent 35%),
          radial-gradient(circle at 80% 10%, rgba(245, 217, 125, 0.18), transparent 30%),
          radial-gradient(circle at 50% 80%, rgba(146, 162, 247, 0.14), transparent 32%),
          linear-gradient(135deg, #0a0f1c, #080b14 50%, #0f182a);
        padding: 48px 24px;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px 26px;
        background: rgba(12, 18, 32, 0.7);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 4vw, 40px);
        letter-spacing: -0.5px;
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 14px;
      }
      .links {
        display: grid;
        gap: 12px;
      }
      a {
        text-decoration: none;
        color: var(--accent);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: border-color 0.2s, background 0.2s, transform 0.2s;
        background: rgba(255, 255, 255, 0.02);
      }
      a:hover {
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.06);
        transform: translateY(-1px);
      }
      .label {
        font-weight: 600;
      }
      .slug {
        font-family: "DM Mono", ui-monospace, monospace;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>🜃 zalgo-cipher portals ⏾𓃠⟡</h1>
      <p>choose your layer: original or v2.</p>
      <div class="links">
        <a href="./zalgo-cipher.html">
          <span class="label">zalgo-cipher</span>
          <span class="slug">zalgo-cipher.html</span>
        </a>
        <a href="./zalgo-cipher-v2.html">
          <span class="label">zalgo-cipher-v2</span>
          <span class="slug">zalgo-cipher-v2.html</span>
        </a>
      </div>
    </main>
  </body>
</html>
